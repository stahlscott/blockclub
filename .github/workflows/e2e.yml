name: E2E Tests

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test'
        required: false
        default: main
        type: string
    secrets:
      SUPABASE_TEST_URL:
        required: true
      SUPABASE_TEST_KEY:
        required: true
      SUPABASE_SERVICE_ROLE_KEY:
        required: true
      SUPABASE_ACCESS_TOKEN:
        required: true
      E2E_TEST_USER_EMAIL:
        required: true
      E2E_TEST_USER_PASSWORD:
        required: true
      E2E_STAFF_ADMIN_EMAIL:
        required: true
      E2E_STAFF_ADMIN_PASSWORD:
        required: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  STAFF_ADMIN_EMAILS: ${{ secrets.E2E_STAFF_ADMIN_EMAIL }}
  E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
  E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
  E2E_STAFF_ADMIN_EMAIL: ${{ secrets.E2E_STAFF_ADMIN_EMAIL }}
  E2E_STAFF_ADMIN_PASSWORD: ${{ secrets.E2E_STAFF_ADMIN_PASSWORD }}

jobs:
  prepare-e2e-database:
    name: Prepare E2E database
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STAFF_ADMIN_EMAILS: ${{ secrets.E2E_STAFF_ADMIN_EMAIL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - run: npm ci

      - name: Apply migrations to E2E database
        run: |
          PROJECT_REF="${NEXT_PUBLIC_SUPABASE_URL#https://}"
          PROJECT_REF="${PROJECT_REF%%.*}"
          test -n "$PROJECT_REF"
          supabase link --project-ref "$PROJECT_REF"
          supabase db push

      - name: Provision E2E staff allowlist
        run: npm run sync:staff-admins

  e2e-tests:
    name: E2E Tests
    needs: prepare-e2e-database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install required Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Build app
        run: npm run build:web

      - name: Run E2E tests
        run: cd apps/web && npx playwright test --shard=${{ matrix.shard }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ strategy.job-index }}
          path: apps/web/test-results/
          retention-days: 7
