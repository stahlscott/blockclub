name: Full Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to validate'
        required: true
        default: main
        type: string

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - run: npm ci

      - name: Start local Supabase
        run: supabase start

      - name: Run integration tests
        run: npm run test:integration

      - name: Capture Supabase logs
        if: failure()
        run: supabase logs

  e2e-tests:
    name: E2E Tests
    needs: integration-tests
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit
