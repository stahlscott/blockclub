name: Release to Production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual push to prod)'
        required: false
        default: false
        type: boolean

jobs:
  # E2E coverage runs separately through Full Validation and is intentionally
  # not a production-release gate while the shared E2E environment is repaired.
  run-migrations:
    name: Run migrations
    runs-on: ubuntu-latest
    if: inputs.dry_run == false
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Push migrations to production
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Provision production staff allowlist
        run: npm run sync:staff-admins
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROD_PROJECT_REF }}.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_PROD_SECRET_KEY }}
          STAFF_ADMIN_EMAILS: ${{ secrets.PROD_STAFF_ADMIN_EMAILS }}

  fast-forward-prod:
    name: Fast-forward prod to main
    runs-on: ubuntu-latest
    needs: run-migrations
    if: |
      always() &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward prod to main
        run: |
          git fetch origin main prod

          MAIN_SHA=$(git rev-parse origin/main)
          PROD_SHA=$(git rev-parse origin/prod)

          echo "Main SHA: $MAIN_SHA"
          echo "Prod SHA: $PROD_SHA"

          if [ "$MAIN_SHA" = "$PROD_SHA" ]; then
            echo "prod is already at the same commit as main, nothing to do"
            exit 0
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would fast-forward prod from $PROD_SHA to $MAIN_SHA"
          else
            echo "Fast-forwarding prod to main..."
            git push origin origin/main:refs/heads/prod
            echo "Successfully updated prod to $MAIN_SHA"
          fi
