name: Release to Production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual push to prod)'
        required: false
        default: false
        type: boolean

jobs:
  prepare-e2e-database:
    name: Prepare E2E database
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STAFF_ADMIN_EMAILS: ${{ secrets.E2E_STAFF_ADMIN_EMAIL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - run: npm ci

      - name: Apply migrations to E2E database
        run: |
          PROJECT_REF="${NEXT_PUBLIC_SUPABASE_URL#https://}"
          PROJECT_REF="${PROJECT_REF%%.*}"
          test -n "$PROJECT_REF"
          supabase link --project-ref "$PROJECT_REF"
          supabase db push

      - name: Provision E2E staff allowlist
        run: npm run sync:staff-admins

  e2e-tests:
    name: E2E Tests (${{ matrix.shard }})
    needs: prepare-e2e-database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STAFF_ADMIN_EMAILS: ${{ secrets.E2E_STAFF_ADMIN_EMAIL }}
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      E2E_STAFF_ADMIN_EMAIL: ${{ secrets.E2E_STAFF_ADMIN_EMAIL }}
      E2E_STAFF_ADMIN_PASSWORD: ${{ secrets.E2E_STAFF_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build app
        run: npm run build:web

      - name: Run E2E tests
        run: cd apps/web && npx playwright test --shard=${{ matrix.shard }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ strategy.job-index }}
          path: apps/web/test-results/
          retention-days: 7

  run-migrations:
    name: Run migrations
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: inputs.dry_run == false
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Push migrations to production
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Provision production staff allowlist
        run: npm run sync:staff-admins
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROD_PROJECT_REF }}.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_PROD_SECRET_KEY }}
          STAFF_ADMIN_EMAILS: ${{ secrets.PROD_STAFF_ADMIN_EMAILS }}

  fast-forward-prod:
    name: Fast-forward prod to main
    runs-on: ubuntu-latest
    needs: [e2e-tests, run-migrations]
    if: |
      always() &&
      needs.e2e-tests.result == 'success' &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward prod to main
        run: |
          git fetch origin main prod

          MAIN_SHA=$(git rev-parse origin/main)
          PROD_SHA=$(git rev-parse origin/prod)

          echo "Main SHA: $MAIN_SHA"
          echo "Prod SHA: $PROD_SHA"

          if [ "$MAIN_SHA" = "$PROD_SHA" ]; then
            echo "prod is already at the same commit as main, nothing to do"
            exit 0
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would fast-forward prod from $PROD_SHA to $MAIN_SHA"
          else
            echo "Fast-forwarding prod to main..."
            git push origin origin/main:refs/heads/prod
            echo "Successfully updated prod to $MAIN_SHA"
          fi
